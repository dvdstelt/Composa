name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 22.04 rather than latest: a self-contained build links against the build machine's glibc, and
    # 24.04 would produce binaries that refuse to start on Debian 12 or Ubuntu 22.04.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tags, or it versions everything 0.0.0.

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      # Screenshots are how a UI regression is inspected without a display, so they are worth
      # keeping when something failed.
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots/
          if-no-files-found: ignore

  # The same suite on Windows, headless UI tests included. Composa is developed on Linux, so this is
  # the only place a path separator, a line ending or a platform folder is tested the other way round.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tags, or it versions everything 0.0.0.

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: artifacts/screenshots/
          if-no-files-found: ignore

  packaging:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream

      # A malformed desktop entry or metainfo file fails the build rather than shipping and
      # quietly making the app invisible in a software centre.
      - name: Validate desktop entry
        run: desktop-file-validate packaging/composa.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate packaging/composa.metainfo.xml

      - name: Check every script parses
        run: for f in scripts/*.sh scripts/package/*.sh; do bash -n "$f"; done

  # The packaging scripts used to be exercised only by a release, which meant a release rehearsal
  # was the first thing to discover that they did not run on a clean checkout. x86-64 only: arm64
  # differs in the runner rather than in the scripts, and is covered by the release workflow.
  packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tags, or it versions everything 0.0.0.

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm desktop-file-utils

      # This is deliberately the first dotnet command of the job, exactly as it is in a release, so
      # that anything the scripts assume a previous build left behind fails here instead.
      - name: Build every package
        run: scripts/package/all.sh linux-x64 dist

      - name: Check what was produced
        run: |
          ls -lh dist/
          test -n "$(find dist -name '*.tar.gz')"   || { echo "no tarball";  exit 1; }
          test -n "$(find dist -name '*.deb')"      || { echo "no deb";      exit 1; }
          test -n "$(find dist -name '*.rpm')"      || { echo "no rpm";      exit 1; }
          test -n "$(find dist -name '*.AppImage')" || { echo "no AppImage"; exit 1; }

      # Kept for a week, so a change can be tried on a real machine before it is released.
      - uses: actions/upload-artifact@v4
        with:
          name: composa-linux-x64
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # The Windows zip and installer, for the same reason the Linux packages are built above: a release
  # must not be the first thing to run these scripts. The installer needs Inno Setup, which is
  # Windows only, so this runs there. x64 only, as on Linux; arm64 differs only in the RID.
  packages-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the tags, or it versions everything 0.0.0.

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress }

      - name: Build the zip and the installer
        run: scripts/package/windows.sh win-x64 dist

      - name: Check what was produced
        run: |
          ls -lh dist/
          test -n "$(find dist -name '*-win-x64.zip')"       || { echo "no zip";       exit 1; }
          test -n "$(find dist -name '*-win-x64-setup.exe')" || { echo "no installer"; exit 1; }

      # Composa is developed on Linux, so this is how a change reaches a Windows machine before it
      # is released. Kept for a week.
      - uses: actions/upload-artifact@v4
        with:
          name: composa-win-x64
          path: dist/*
          retention-days: 7
          if-no-files-found: error
